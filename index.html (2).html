<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>進項發票 AI 自動辨識系統</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- SheetJS -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-12">
  <div class="max-w-4xl mx-auto px-4 py-8">
    <header class="mb-6 text-center sm:text-left border-b border-slate-200 pb-6">
      <h1 class="text-2xl sm:text-3xl font-bold text-slate-900 flex items-center justify-center sm:justify-start gap-3">
        <i data-lucide="sparkles" class="w-8 h-8 text-blue-600"></i>
        進項發票 AI 自動掃描對帳系統
      </h1>
      <p class="text-sm text-slate-500 mt-2">手機拍照 ➔ AI 秒速解析 ➔ 一鍵匯出 Excel 報表</p>
    </header>

    <!-- 上傳區塊 -->
    <div class="bg-white rounded-2xl border-2 border-dashed border-blue-200 p-8 text-center mb-6 hover:border-blue-400 transition-colors shadow-sm">
      <input type="file" id="fileInput" multiple accept="image/*" capture="environment" class="hidden">
      <label for="fileInput" class="cursor-pointer flex flex-col items-center justify-center gap-3">
        <div class="w-16 h-16 bg-blue-50 text-blue-600 rounded-full flex items-center justify-center shadow-inner">
          <i data-lucide="camera" class="w-8 h-8"></i>
        </div>
        <div>
          <span class="text-lg font-semibold text-blue-600">點擊拍照或上傳發票</span>
          <p class="text-xs text-slate-400 mt-1">無需輸入 Key，支援一次批次上傳多張照片</p>
        </div>
      </label>
    </div>

    <!-- 辨識進度條 -->
    <div id="progressContainer" class="hidden mb-6 bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
      <div class="flex justify-between items-center mb-2">
        <span id="progressText" class="text-sm font-medium text-slate-700">正在處理中...</span>
        <span id="progressPercent" class="text-xs font-semibold text-blue-600">0%</span>
      </div>
      <div class="w-full bg-slate-100 rounded-full h-2.5 overflow-hidden">
        <div id="progressBar" class="bg-blue-600 h-2.5 rounded-full w-0 transition-all duration-300"></div>
      </div>
    </div>

    <!-- 錯誤訊息提示 -->
    <div id="errorBox" class="hidden mb-6 bg-rose-50 border border-rose-200 text-rose-700 p-4 rounded-xl text-sm font-mono whitespace-pre-wrap"></div>

    <!-- 結果表格 -->
    <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden mb-8">
      <div class="p-4 border-b border-slate-200 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
        <div>
          <h2 class="text-lg font-bold text-slate-900">發票明細表</h2>
          <p class="text-xs text-slate-500">可在表格中直接進行文字修訂</p>
        </div>
        <button id="exportBtn" onclick="exportToExcel()" disabled class="w-full sm:w-auto px-5 py-2.5 bg-emerald-600 hover:bg-emerald-700 disabled:bg-slate-300 text-white text-sm font-medium rounded-lg shadow-sm flex items-center justify-center gap-2 transition-all">
          <i data-lucide="download" class="w-4 h-4"></i>
          下載 Excel 表格 (.xlsx)
        </button>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-sm text-left border-collapse">
          <thead class="text-xs text-slate-700 uppercase bg-slate-50 border-b border-slate-200">
            <tr>
              <th class="px-3 py-3 min-w-[100px]">日期</th>
              <th class="px-3 py-3 min-w-[120px]">發票號碼</th>
              <th class="px-3 py-3 min-w-[140px]">品名</th>
              <th class="px-3 py-3 min-w-[70px]">數量</th>
              <th class="px-3 py-3 min-w-[80px]">單價</th>
              <th class="px-3 py-3 min-w-[80px]">金額</th>
              <th class="px-3 py-3 min-w-[80px]">稅額</th>
              <th class="px-3 py-3 min-w-[90px]">總額</th>
              <th class="px-3 py-3 min-w-[140px]">開票廠商</th>
              <th class="px-3 py-3 min-w-[50px] text-center">刪除</th>
            </tr>
          </thead>
          <tbody id="invoiceTableBody">
            <tr id="emptyRow">
              <td colspan="10" class="text-center py-12 text-slate-400">
                <i data-lucide="file-text" class="w-10 h-10 mx-auto mb-2 stroke-1"></i>
                點擊上方按鈕即可直接拍照辨識
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    lucide.createIcons();
    let invoiceData = [];

    function compressImage(file, maxWidth = 1024, quality = 0.8) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;

            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);

            const dataUrl = canvas.toDataURL('image/jpeg', quality);
            resolve({ base64: dataUrl.split(',')[1], mimeType: 'image/jpeg' });
          };
          img.onerror = () => reject(new Error('圖片讀取失敗'));
        };
        reader.onerror = (err) => reject(err);
      });
    }

    document.getElementById('fileInput').addEventListener('change', async function(e) {
      const errorBox = document.getElementById('errorBox');
      errorBox.classList.add('hidden');
      errorBox.innerText = '';

      const files = Array.from(e.target.files);
      if (files.length === 0) return;

      const progressContainer = document.getElementById('progressContainer');
      const progressBar = document.getElementById('progressBar');
      const progressText = document.getElementById('progressText');
      const progressPercent = document.getElementById('progressPercent');

      progressContainer.classList.remove('hidden');

      for (let i = 0; i < files.length; i++) {
        const file = files[i];
        const percent = Math.round(((i + 1) / files.length) * 100);
        progressText.innerText = `AI 正在解析第 (${i + 1}/${files.length}) 張發票: ${file.name}`;
        progressBar.style.width = `${percent}%`;
        progressPercent.innerText = `${percent}%`;

        try {
          const imgData = await compressImage(file);
          const response = await fetch('/api/parse', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ base64Data: imgData.base64, mimeType: imgData.mimeType })
          });

          if (!response.ok) {
            const errRes = await response.json().catch(() => ({}));
            throw new Error(errRes.error || `HTTP ${response.status}`);
          }

          const parsed = await response.json();
          invoiceData.push(parsed);
        } catch (err) {
          console.error(err);
          errorBox.classList.remove('hidden');
          errorBox.innerText += `❌ [${file.name}] 解析失敗: ${err.message}\n`;
        }
      }

      renderTable();
      if (invoiceData.length > 0) {
        document.getElementById('exportBtn').disabled = false;
      }
      setTimeout(() => progressContainer.classList.add('hidden'), 1500);
    });

    function renderTable() {
      const tbody = document.getElementById('invoiceTableBody');
      tbody.innerHTML = '';

      if (invoiceData.length === 0) {
        tbody.innerHTML = `<tr id="emptyRow"><td colspan="10" class="text-center py-12 text-slate-400">目前尚無資料</td></tr>`;
        return;
      }

      invoiceData.forEach((row, idx) => {
        const tr = document.createElement('tr');
        tr.className = "border-b border-slate-100 hover:bg-slate-50 transition-colors";
        tr.innerHTML = `
          <td class="p-2"><input type="text" value="${row.date || ''}" onchange="updateData(${idx}, 'date', this.value)" class="w-full bg-transparent border border-slate-200 rounded px-2 py-1 text-xs"></td>
          <td class="p-2"><input type="text" value="${row.invNum || ''}" onchange="updateData(${idx}, 'invNum', this.value)" class="w-full bg-transparent border border-slate-200 rounded px-2 py-1 text-xs font-mono"></td>
          <td class="p-2"><input type="text" value="${row.item || ''}" onchange="updateData(${idx}, 'item', this.value)" class="w-full bg-transparent border border-slate-200 rounded px-2 py-1 text-xs"></td>
          <td class="p-2"><input type="number" value="${row.qty || 1}" onchange="updateData(${idx}, 'qty', this.value)" class="w-full bg-transparent border border-slate-200 rounded px-2 py-1 text-xs"></td>
          <td class="p-2"><input type="number" value="${row.unitPrice || 0}" onchange="updateData(${idx}, 'unitPrice', this.value)" class="w-full bg-transparent border border-slate-200 rounded px-2 py-1 text-xs"></td>
          <td class="p-2"><input type="number" value="${row.amount || 0}" onchange="updateData(${idx}, 'amount', this.value)" class="w-full bg-transparent border border-slate-200 rounded px-2 py-1 text-xs"></td>
          <td class="p-2"><input type="number" value="${row.tax || 0}" onchange="updateData(${idx}, 'tax', this.value)" class="w-full bg-transparent border border-slate-200 rounded px-2 py-1 text-xs"></td>
          <td class="p-2"><input type="number" value="${row.total || 0}" onchange="updateData(${idx}, 'total', this.value)" class="w-full bg-transparent border border-slate-200 rounded px-2 py-1 text-xs font-semibold text-blue-600"></td>
          <td class="p-2"><input type="text" value="${row.vendor || ''}" onchange="updateData(${idx}, 'vendor', this.value)" class="w-full bg-transparent border border-slate-200 rounded px-2 py-1 text-xs"></td>
          <td class="p-2 text-center">
            <button onclick="deleteRow(${idx})" class="text-rose-500 hover:text-rose-700 p-1 rounded hover:bg-rose-50">
              <i data-lucide="trash-2" class="w-4 h-4"></i>
            </button>
          </td>
        `;
        tbody.appendChild(tr);
      });
      lucide.createIcons();
    }

    function updateData(idx, field, val) {
      invoiceData[idx][field] = val;
    }

    function deleteRow(idx) {
      invoiceData.splice(idx, 1);
      renderTable();
      if (invoiceData.length === 0) {
        document.getElementById('exportBtn').disabled = true;
      }
    }

    function exportToExcel() {
      if (invoiceData.length === 0) return;

      const excelHeaderData = invoiceData.map(item => ({
        "日期": item.date,
        "發票號碼": item.invNum,
        "品名": item.item,
        "數量": Number(item.qty),
        "單價": Number(item.unitPrice),
        "金額": Number(item.amount),
        "稅額": Number(item.tax),
        "總額": Number(item.total),
        "開票廠商": item.vendor
      }));

      const worksheet = XLSX.utils.json_to_sheet(excelHeaderData);
      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, "進項發票明細");

      XLSX.writeFile(workbook, "進項發票明細表.xlsx");
    }
  </script>
</body>
</html>
