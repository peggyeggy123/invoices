<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>進項發票 AI 自動辨識系統 (Gemini版)</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- SheetJS for Exporting Excel -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-12">
  <div class="max-w-4xl mx-auto px-4 py-8">
    <header class="mb-6 text-center sm:text-left border-b border-slate-200 pb-6">
      <h1 class="text-2xl sm:text-3xl font-bold text-slate-900 flex items-center justify-center sm:justify-start gap-3">
        <i data-lucide="sparkles" class="w-8 h-8 text-blue-600"></i>
        進項發票 AI 自動掃描系統 (Gemini 免費版)
      </h1>
      <p class="text-sm text-slate-500 mt-2">使用 Google Gemini API 免費精準辨識 ➔ 自動整理 ➔ 下載 Excel 表格</p>
    </header>

    <!-- API Key 輸入區塊 -->
    <div class="bg-blue-50 border border-blue-200 rounded-xl p-4 mb-6">
      <label for="apiKeyInput" class="block text-xs font-semibold text-blue-800 mb-1 flex items-center gap-1">
        <i data-lucide="key" class="w-4 h-4"></i> 請輸入 Google Gemini API Key
      </label>
      <input type="password" id="apiKeyInput" placeholder="請貼上您的 Gemini API Key" class="w-full text-sm px-3 py-2 border border-blue-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white font-mono">
      <p class="text-xs text-blue-600 mt-1">支援傳統 AIzaSy... 與新型 AQ.Ab8... 格式 API Key。</p>
    </div>

    <!-- 上傳按鈕 -->
    <div class="bg-white rounded-2xl border-2 border-dashed border-blue-200 p-8 text-center mb-6 hover:border-blue-400 transition-colors">
      <input type="file" id="fileInput" multiple accept="image/*" capture="environment" class="hidden">
      <label for="fileInput" class="cursor-pointer flex flex-col items-center justify-center gap-3">
        <div class="w-16 h-16 bg-blue-50 text-blue-600 rounded-full flex items-center justify-center shadow-inner">
          <i data-lucide="camera" class="w-8 h-8"></i>
        </div>
        <div>
          <span class="text-base font-semibold text-blue-600">點擊拍照或選擇發票照片</span>
          <p class="text-xs text-slate-400 mt-1">支援批次選擇多張發票照片（JPG, PNG）</p>
        </div>
      </label>
    </div>

    <!-- 辨識進度 -->
    <div id="progressContainer" class="hidden mb-6 bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
      <div class="flex justify-between items-center mb-2">
        <span id="progressText" class="text-sm font-medium text-slate-700">Gemini AI 正在辨識發票...
